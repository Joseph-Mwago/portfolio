<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="topnav">
  <div class="wrap nav-wrap">
    <a href="index.html" class="nav-brand">Joseph Mwago</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="media.html" class="active">Media</a>
    </div>
  </div>
</nav>

<header class="hero hero-compact">
  <div class="wrap">
    <h1>Media</h1>
    <p class="tagline">Photos and videos from the workshop, the project, and beyond.</p>
  </div>
</header>

<main class="wrap">

  <!-- Tabs -->
  <div class="tabs" role="tablist">
    <button class="tab active" role="tab" data-tab="photos">Photos</button>
    <button class="tab" role="tab" data-tab="videos">Videos</button>
  </div>

  <!-- Photos panel -->
  <section class="tab-panel active" id="panel-photos">
    <div class="panel-head">
      <p class="panel-hint">139 photos · click any to open, or start the slideshow.</p>
      <button class="btn-primary" id="start-slideshow">▶ Play slideshow</button>
    </div>
    <div class="photo-grid" id="photo-grid">
      <!-- Generated by script below -->
    </div>
  </section>

  <!-- Videos panel -->
  <section class="tab-panel" id="panel-videos">
    <p class="panel-hint">Videos hosted on YouTube.</p>
    <div class="video-grid">
      <!-- Replace VIDEO_ID_1 with actual YouTube IDs -->
      <div class="video-item">
        <iframe src="https://www.youtube.com/embed/VIDEO_ID_1"
                title="Cake frosting machine demo"
                loading="lazy" allowfullscreen></iframe>
      </div>
      <div class="video-item">
        <iframe src="https://www.youtube.com/embed/VIDEO_ID_2"
                title="Performance"
                loading="lazy" allowfullscreen></iframe>
      </div>
      <!-- Add more .video-item blocks here -->
    </div>
  </section>

</main>

<!-- Slideshow overlay -->
<div class="slideshow" id="slideshow" aria-hidden="true">
  <button class="ss-close" id="ss-close" aria-label="Close">✕</button>
  <button class="ss-nav ss-prev" id="ss-prev" aria-label="Previous">‹</button>
  <img id="ss-img" src="" alt="">
  <button class="ss-nav ss-next" id="ss-next" aria-label="Next">›</button>
  <div class="ss-counter" id="ss-counter"></div>
</div>

<footer>
  <div class="wrap">
    © 2026 · Built with plain HTML, hosted on GitHub Pages
  </div>
</footer>

<script>
  // ====== CONFIG: how many photos ======
  const PHOTO_COUNT = 139;
  const PAD = 3;            // matches photo-001.jpg
  const PREFIX = "photo-";
  const EXT = ".jpg";
  const FOLDER = "images/";

  // Build list of photo URLs
  const photos = [];
  for (let i = 1; i <= PHOTO_COUNT; i++) {
    const num = String(i).padStart(PAD, "0");
    photos.push(`${FOLDER}${PREFIX}${num}${EXT}`);
  }

  // ====== Build grid ======
  const grid = document.getElementById("photo-grid");
  photos.forEach((src, idx) => {
    const img = document.createElement("img");
    img.src = src;
    img.alt = `Photo ${idx + 1}`;
    img.loading = "lazy";
    img.decoding = "async";
    img.addEventListener("click", () => openSlideshow(idx));
    grid.appendChild(img);
  });

  // ====== Tabs ======
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById("panel-" + tab.dataset.tab).classList.add("active");
      // update URL hash for shareable links
      history.replaceState(null, "", "#" + tab.dataset.tab);
    });
  });
  // Open correct tab from URL hash
  if (location.hash === "#videos") {
    document.querySelector('[data-tab="videos"]').click();
  }

  // ====== Slideshow ======
  const ss = document.getElementById("slideshow");
  const ssImg = document.getElementById("ss-img");
  const ssCounter = document.getElementById("ss-counter");
  let ssIndex = 0;

  function openSlideshow(i) {
    ssIndex = i;
    ssImg.src = photos[ssIndex];
    ssCounter.textContent = `${ssIndex + 1} / ${photos.length}`;
    ss.classList.add("open");
    ss.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
  }

  function closeSlideshow() {
    ss.classList.remove("open");
    ss.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
  }

  function showNext(delta) {
    ssIndex = (ssIndex + delta + photos.length) % photos.length;
    ssImg.src = photos[ssIndex];
    ssCounter.textContent = `${ssIndex + 1} / ${photos.length}`;
  }

  document.getElementById("start-slideshow").addEventListener("click", () => openSlideshow(0));
  document.getElementById("ss-close").addEventListener("click", closeSlideshow);
  document.getElementById("ss-prev").addEventListener("click", () => showNext(-1));
  document.getElementById("ss-next").addEventListener("click", () => showNext(1));

  ss.addEventListener("click", (e) => {
    if (e.target === ss) closeSlideshow();
  });

  document.addEventListener("keydown", (e) => {
    if (!ss.classList.contains("open")) return;
    if (e.key === "Escape") closeSlideshow();
    if (e.key === "ArrowLeft") showNext(-1);
    if (e.key === "ArrowRight") showNext(1);
  });
</script>

</body>
</html>
